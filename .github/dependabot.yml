version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "cli:"
    ignore:
      # Match the supported runtime. New Node majors need an explicit support decision.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      development-dependencies:
        dependency-type: development
        # Major toolchain upgrades get separate PRs and compatibility review.
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "cli:"
