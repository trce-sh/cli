name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Node 22 · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.34.5 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # verify (check, typecheck, test) runs once here. smoke:package and pack:check only build.
      - name: Verify source
        run: pnpm run verify
      - name: Verify release metadata
        run: pnpm run release:check
      - name: Smoke installed package
        run: pnpm run smoke:package
      - name: Check synthetic parser memory budget
        run: pnpm run benchmark
