name: Bug report
description: Report a reproducible CLI problem without sharing private agent data.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include prompts, responses, source code, diffs, credentials, or private repository names.
  - type: input
    id: version
    attributes:
      label: trce version
      description: Run `trce --version`.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction
      description: Use a disposable repository and sanitized names where possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed prompts, responses, source code, diffs, credentials, local paths, and private repository names.
          required: true
